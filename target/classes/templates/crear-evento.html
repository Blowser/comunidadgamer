<!DOCTYPE HTML>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8">
    <title>Crear Evento</title>
    <link rel="stylesheet" href="/estilo.css">
</head>

<body>

    <header>
        <h1>Crear Evento Gamer</h1>
    </header>

    <main>

        <a href="/home">
            Volver al Inicio
        </a>

        <hr>

        <form action="/crear-evento" method="post">


            <label for="nombre">
                Nombre del Evento
            </label>

            <input
                type="text"
                id="nombre"
                name="nombre"
                required>

            <label for="categoria">
                Categoría
            </label>

            <select id="categoria" name="categoria">

                <option>Pokémon TCG</option>

                <option>League of Legends</option>

                <option>Valorant</option>

                <option>Minecraft</option>

                <option>Smash Bros</option>

            </select>

            <label for="ubicacion">
                Ubicación
            </label>

            <input
                type="text"
                id="ubicacion"
                name="ubicacion"
                required>

            <label for="modalidad">
                Modalidad
            </label>

            <select id="modalidad" name="modalidad">

                <option>Presencial</option>

                <option>Online</option>

            </select>

            <label for="fecha">
                Fecha
            </label>

            <input
                type="date"
                id="fecha"
                name="fecha">

            <label for="organizador">
                Organizador
            </label>

            <input
                type="text"
                id="organizador"
                name="organizador">

            <label for="descripcion">
                Descripción
            </label>

            <textarea
                id="descripcion"
                name="descripcion">
            </textarea>

            <br><br>

            <button type="submit">
                Crear Evento
            </button>

        </form>

    </main>

</body>

</html>
