<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org">

<head>
    <title>Login - Comunidad Gamer</title>
    <link rel="stylesheet"
          type="text/css"
          href="/estilo.css">
</head>

<body>

    <h1>Iniciar Sesión</h1>

    <div th:if="${param.error}">
        Usuario o contraseña incorrectos ❌
    </div>

    <div th:if="${param.logout}">
        Sesión cerrada correctamente ✅
    </div>

    <form th:action="@{/login}" method="post">

        <div>
            <label>
                Usuario:
                <input type="text"
                       name="username"
                       required>
            </label>
        </div>

        <br>

        <div>
            <label>
                Contraseña:
                <input type="password"
                       name="password"
                       required>
            </label>
        </div>

        <br>

        <button type="submit">
            Ingresar
        </button>

    </form>

</body>

</html>
